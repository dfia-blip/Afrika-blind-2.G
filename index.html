<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMVV – Zeměpis – 2.G – Afrika</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f5f7;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  text-align:center
}

header{
  padding:12px 10px 4px
}

h1{
  font-size:25px;
  margin:5px 0
}

h2{
  font-size:22px;
  margin:5px 0 12px
}

.sub{
  color:#666;
  font-size:15px
}

.controls,
.choices{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:10px
}

button{
  border:0;
  border-radius:22px;
  padding:12px 17px;
  font-size:17px;
  font-weight:750;
  background:#ddd;
  color:#111;
  cursor:pointer
}

button.active{
  background:#111;
  color:#fff
}

button:disabled{
  opacity:.4;
  cursor:not-allowed
}

#settings{
  background:#fff;
  border-radius:18px;
  padding:10px;
  margin:8px auto;
  max-width:850px
}

#questionCount button{
  font-size:15px;
  padding:9px 13px
}

#stats{
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
  font-size:17px;

  margin:9px
}

#question{

}

#progress{
  font-size:16px;

}

#result{

  margin:9px
}

#mapBox{
  width:calc(100% - 16px);
  max-width:900px;
  margin:8px auto 22px;
  background:#fff;
  border-radius:25px;
  padding:5px;
  overflow:hidden;
  box-shadow:0 3px 18px #00000010
}

svg{
  display:block;
  width:100%;
  height:auto
}

.country{
  fill:#d9d9d9;
  stroke:#858585;
  stroke-width:.7
}

.country.correct{
  fill:#64c174;
  stroke:#347c43;
  stroke-width:1.5
}

.country.wrong{
  fill:#e57373;
  stroke:#a52e2e;
  stroke-width:1.5
}

.country.answer{
  fill:#64c174;
  stroke:#347c43;
  stroke-width:2
}

.hit{
  fill:transparent;
  stroke:transparent;
  cursor:pointer
}

.physicalArea{
  fill:#8bc34a;
  fill-opacity:.32;
  stroke:#4d7c2a;
  stroke-width:2;
  pointer-events:none
}

.physicalLine{
  fill:none;
  stroke:#2d78b7;
  stroke-width:4;
  stroke-linecap:round;
  pointer-events:none
}

.physicalPoint{
  fill:#4caf50;
  stroke:#fff;
  stroke-width:2;
  pointer-events:none
}

.revealLabel{
  font-size:13px;
  font-weight:800;
  paint-order:stroke;
  stroke:#fff;
  stroke-width:4px
}

#legend{
  font-size:14px;
  color:#666;
  margin:0 8px 10px
}

#final{
  background:#fff;
  max-width:620px;
  margin:15px auto 25px;
  padding:22px;
  border-radius:22px
}

.finalPercent{
  font-size:42px;
  font-weight:900;
  margin:8px
}

.finalLine{
  font-size:20px;
  font-weight:750;
  margin:7px
}

.hidden{
  display:none!important
}

#loading{
  font-size:20px;
  padding:30px
}

@media(max-width:600px){

  h1{
    font-size:22px
  }

  #question{
    font-size:23px
  }

  button{
    font-size:16px;
    padding:11px 15px
  }

  #mapBox{
    width:calc(100% - 10px);
    border-radius:21px
  }
}
</style>
</head>

<body>

<header>

<h1>🌍 SMVV – Zeměpis – 2.G</h1>

<div class="sub">

<script>

/* =========================================================
   I. FYZICKÁ GEOGRAFIE – 50 POJMŮ
========================================================= */

const PHYSICAL = [

["řeka Orange",20.0,-29.0,"line"]

];


/* =========================================================
   II. STÁTY – 30
========================================================= */

const STATE_NAMES = {

"818":"Egypt",

"434":"Libye",

"788":"Tunisko",

"012":"Alžírsko",

"504":"Maroko",

"478":"Mauritánie",

"686":"Senegal",

"466":"Mali",

"562":"Niger",

"729":"Súdán",

"728":"Jižní Súdán",

"231":"Etiopie",

"706":"Somálsko",

"324":"Guinea",

"384":"Pobřeží slonoviny",

"288":"Ghana",

"566":"Nigérie",

"120":"Kamerun",

"140":"Středoafrická republika",

"180":"DR Kongo",

"800":"Uganda",

"404":"Keňa",

"834":"Tanzanie",

"024":"Angola",

"516":"Namibie",

"894":"Zambie",

"508":"Mosambik",

"716":"Zimbabwe",

"072":"Botswana",

"710":"Jižní Afrika (JAR)"

};


/* =========================================================
   MĚSTA – 20
========================================================= */

const CITIES = [

["Káhira",31.2357,30.0444],

["Alexandrie",29.9187,31.2001],

["Tripolis",13.1913,32.8872],

["Tunis",10.1815,36.8065],

["Alžír",3.0588,36.7538],

["Rabat",-6.8498,34.0209],

["Casablanca",-7.5898,33.5731],

["Dakar",-17.4677,14.7167],

["Abuja",7.3986,9.0765],

["Lagos",3.3792,6.5244],

["Chartúm",32.5599,15.5007],

["Addis Abeba",38.7578,9.0300],

["Nairobi",36.8219,-1.2921],

["Kampala",32.5825,0.3476],

["Dar es Salaam",39.2083,-6.7924],

["Kinshasa",15.2663,-4.4419],

["Luanda",13.2344,-8.8390],

["Antananarivo",47.5079,-18.8792],

["Johannesburg",28.0473,-26.2041],

["Kapské Město",18.4241,-33.9249]

];


/* =========================================================
   VŠECHNY STÁTY AFRIKY – PODKLAD MAPY
========================================================= */

const AFRICA_IDS = new Set([

"012","024","072","108","120","132","140","148",
"174","175","178","180","204","226","231","232",
"262","266","270","288","324","384","404","426",
"430","434","450","454","466","478","480","504",
"508","516","562","566","570","578","586","646",
"678","686","690","694","706","710","716","728",
"729","732","748","768","788","800","818","834",
"854","894"

]);


/* =========================================================
   POMOCNÁ FUNKCE $ (getElementById zkratka)
========================================================= */

function $(id){

return document.getElementById(id);

}


/* =========================================================
   PROMĚNNÉ
========================================================= */

let svg=d3.select("#map");

let projection;
let path;

let allAfrica=[];
let quizStates=[];

let mode="learn";
let section="physical";

let totalQuestions=10;

let questions=[];
let currentIndex=0;

let current=null;

let correct=0;
let wrong=0;

let locked=false;


/* =========================================================
   NAČTENÍ MAPY
========================================================= */

function setControlsEnabled(enabled){

document

.querySelectorAll(".controls button")

.forEach(b=>b.disabled=!enabled);

}


setControlsEnabled(false);


async function loadMap(){

try{

const world=await d3.json(

"https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json"

);

const features=

topojson.feature(

world,

world.objects.countries

).features;


/* všechny africké země */

allAfrica=

features.filter(d=>{

const id=

String(d.id).padStart(3,"0");

return AFRICA_IDS.has(id);

});


/* 30 států z písemky */

quizStates=

features

.filter(d=>{

const id=

String(d.id).padStart(3,"0");

return STATE_NAMES[id];

})

.map(d=>{

const id=

String(d.id).padStart(3,"0");

d.properties=d.properties||{};

d.properties.quizName=

STATE_NAMES[id];

d.properties.mapId=id;

return d;

});


loading.style.display="none";

drawMap();

setControlsEnabled(true);

resetGame();


}catch(err){

console.error(err);

loading.innerHTML=

"❌ Mapu se nepodařilo načíst.<br><br>"+

"Zkontroluj připojení k internetu.";

}

}


/* =========================================================
   VYKRESLENÍ AFRIKY
========================================================= */

function drawMap(){

const box=

document.getElementById("mapBox");

const width=

Math.min(

box.clientWidth-10,

900

);

const height=

width*1.12;


svg

.attr(

"viewBox",

`0 0 ${width} ${height}`

)

.attr("width",width)

.attr("height",height);


const collection={

type:"FeatureCollection",

features:allAfrica

};


projection=

d3.geoNaturalEarth1()

.fitExtent(

[

[10,8],

[width-10,height-8]

],

collection

);


path=

d3.geoPath()

.projection(projection);


svg.selectAll("*").remove();


/* skutečné hranice všech afrických států */

svg

.selectAll(".country")

.data(allAfrica)

.enter()

.append("path")

.attr("class","country")

.attr("d",path);


renderQuizLayers();

}


/* =========================================================
   KLIKACÍ VRSTVA
========================================================= */

function renderQuizLayers(){

svg.selectAll(".quizLayer").remove();

if(!current)return;

const layer=

svg.append("g")

.attr("class","quizLayer");


const vb=

svg

.attr("viewBox")

.split(" ")

.map(Number);


if(section==="states"){

if(current.type==="state"){

layer

.selectAll(".hit")

.data(quizStates)

.enter()

.append("path")

.attr("class","hit")

.attr("d",path)

.on("click",

(e,d)=>answerState(d)

);

}else{

layer

.append("rect")

.attr("x",0)

.attr("y",0)

.attr("width",vb[2])

.attr("height",vb[3])

.attr("fill","transparent")

.on("click",answerCity);

}

}else{

layer

.append("rect")

.attr("x",0)

.attr("y",0)

.attr("width",vb[2])

.attr("height",vb[3])

.attr("fill","transparent")

.on("click",answerPhysical);

}

}


/* =========================================================
   ZAMÍCHÁNÍ
========================================================= */

function shuffle(array){

const result=[...array];

for(

let i=result.length-1;

i>0;

i--

){

const j=

Math.floor(

Math.random()*(i+1)

);

[result[i],result[j]]=

[result[j],result[i]];

}

return result;

}


/* =========================================================
   VYTVOŘENÍ OTÁZEK
========================================================= */

function buildQuestions(){

if(section==="physical"){

questions=

shuffle(

PHYSICAL.map(

(p,i)=>({

type:"physical",

id:i,

name:p[0],

lon:p[1],

lat:p[2],

shape:p[3]

})

)

)

.slice(

0,

Math.min(

totalQuestions,

PHYSICAL.length

)

);

}else{

const states=

quizStates.map(f=>({

type:"state",

id:f.properties.mapId,

name:f.properties.quizName,

feature:f

}));


const cities=

CITIES.map((c,i)=>({

type:"city",

id:i,

name:c[0],

lon:c[1],

lat:c[2]

}));


questions=

shuffle(

[...states,...cities]

)

.slice(

0,

Math.min(

totalQuestions,

50

)

);

}

}


/* =========================================================
   RESET
========================================================= */

function resetGame(){

correct=0;

wrong=0;

currentIndex=0;

locked=false;

$("correct").textContent="0";

$("wrong").textContent="0";

$("percent").textContent="0";

final.classList.add("hidden");

buildQuestions();

nextQuestion();

}


/* =========================================================
   VYČIŠTĚNÍ BAREV Z PŘEDCHOZÍ OTÁZKY
========================================================= */

function clearColors(){

svg

.selectAll(".country")

.classed("correct",false)

.classed("wrong",false)

.classed("answer",false);

svg.selectAll(".revealLayer").remove();

}


/* =========================================================
   DALŠÍ OTÁZKA
========================================================= */

function nextQuestion(){

clearColors();

locked=false;


if(currentIndex>=questions.length){

finishTest();

return;

}


current=

questions[currentIndex];


$("question").textContent=

"Najdi na mapě: "+

current.name;


$("progress").textContent=

`Otázka ${currentIndex+1} z ${questions.length}`;


$("result").textContent="";


renderQuizLayers();

}


/* =========================================================
   STÁT
========================================================= */

function answerState(feature){

if(locked)return;


const id=

String(feature.id).padStart(3,"0");


if(id===current.id){

correct++;

markState(

current.id,

"correct"

);

success(

"✅ Správně!"

);

}else{

wrong++;

markState(

id,

"wrong"

);


if(mode==="learn"){

markState(

current.id,

"answer"

);

error(

"❌ To není "+

(feature.properties.quizName||"tento stát")+

".<br>✅ Správně je: "+

current.name

);

}else{

error("❌ Špatně.");

}

}


afterAnswer();

}


/* =========================================================
   PŘEVOD KLIKNUTÍ NA SOUŘADNICE MAPY
========================================================= */

function clickPoint(event){

const rect=

svg.node().getBoundingClientRect();

const vb=

svg

.attr("viewBox")

.split(" ")

.map(Number);


return [

(event.clientX-rect.left)*vb[2]/rect.width,

(event.clientY-rect.top)*vb[3]/rect.height

];

}


function distance(a,b){

return Math.hypot(

a[0]-b[0],

a[1]-b[1]

);

}


/* =========================================================
   MĚSTA
========================================================= */

function answerCity(event){

if(locked)return;


const click=

clickPoint(event);


const target=

projection([

current.lon,

current.lat

]);


const width=

+svg

.attr("viewBox")

.split(" ")[2];


const tolerance=

Math.max(

22,

width*.028

);


if(

distance(

click,

target

)<=tolerance

){

correct++;

revealCurrent();

success(

"✅ Správně!"

);

}else{

wrong++;


if(mode==="learn"){

revealCurrent();

error(

"❌ Tady město není.<br>"+

"✅ Správně je: "+

current.name

);

}else{

error("❌ Špatně.");

}

}


afterAnswer();

}


/* =========================================================
   FYZICKÁ GEOGRAFIE
========================================================= */

function answerPhysical(event){

if(locked)return;


const click=

clickPoint(event);


const target=

projection([

current.lon,

current.lat

]);


const width=

+svg

.attr("viewBox")

.split(" ")[2];


let tolerance;


if(current.shape==="point"){

tolerance=

Math.max(

18,

width*.025

);

}else if(current.shape==="line"){

tolerance=

Math.max(

30,

width*.055

);

}else{

tolerance=

Math.max(

48,

width*.085

);

}


if(

distance(

click,

target

)<=tolerance

){

correct++;

revealCurrent();

success(

"✅ Správně!"

);

}else{

wrong++;


if(mode==="learn"){

revealCurrent();

error(

"❌ Tady se pojem nenachází.<br>"+

"✅ Správná poloha: "+

current.name

);

}else{

error("❌ Špatně.");

}

}


afterAnswer();

}


/* =========================================================
   ZOBRAZENÍ SPRÁVNÉ ODPOVĚDI
========================================================= */

function revealCurrent(){

svg

.selectAll(".revealLayer")

.remove();


const g=

svg

.append("g")

.attr("class","revealLayer");


if(current.type==="state"){

g

.append("path")

.datum(current.feature)

.attr("class","country answer")

.attr("d",path);

return;

}


const [x,y]=

projection([

current.lon,

current.lat

]);


if(current.shape==="line"){

g

.append("path")

.attr(

"class",

"physicalLine"

)

.attr(

"d",

`M ${x-48} ${y+24}

Q ${x} ${y}

${x+48} ${y-24}`

);

}else if(current.shape==="area"){

g

.append("ellipse")

.attr(

"class",

"physicalArea"

)

.attr("cx",x)

.attr("cy",y)

.attr("rx",58)

.attr("ry",34);

}else{

g

.append("circle")

.attr(

"class",

"physicalPoint"

)

.attr("cx",x)

.attr("cy",y)

.attr("r",9);

}


g

.append("text")

.attr(

"class",

"revealLabel"

)

.attr("x",x+10)

.attr("y",y-10)

.text(current.name);

}


/* =========================================================
   PO ODPOVĚDI
========================================================= */

function afterAnswer(){

updateStats();

locked=true;


let delay=800;


if(

mode==="learn" &&

wrong>0

){

delay=1900;

}


setTimeout(()=>{

currentIndex++;

nextQuestion();

},delay);

}


/* =========================================================
   ZPRÁVY
========================================================= */

function success(text){

$("result").innerHTML=text;

$("result").style.color="#25833b";

}


function error(text){

$("result").innerHTML=text;

$("result").style.color="#b3261e";

}


/* =========================================================
   OZNAČENÍ STÁTU
========================================================= */

function markState(id,cls){

svg

.selectAll(".country")

.filter(

d=>

String(d.id)

.padStart(3,"0")

===id

)

.classed(

cls,

true

);

}


/* =========================================================
   STATISTIKA
========================================================= */

function updateStats(){

$("correct").textContent=

correct;

$("wrong").textContent=

wrong;


const answered=

correct+wrong;


const percentage=

answered

?

Math.round(

correct/answered*100

)

:0;


$("percent").textContent=

percentage;

}


/* =========================================================
   KONEC
========================================================= */

function finishTest(){

locked=true;


const total=

questions.length;


const percentage=

total

?

Math.round(

correct/total*100

)

:0;


$("finalPercent").textContent=

percentage;


$("finalCorrect").textContent=

correct;


$("finalWrong").textContent=

wrong;


$("finalTotal").textContent=

total;


let message;


if(mode==="learn"){

message=

"Výukové kolo dokončeno. Teď můžeš zkusit písemku.";

}else if(percentage>=90){

message=

"🏆 Výborně!";

}else if(percentage>=75){

message=

"👏 Velmi dobrý výsledek.";

}else if(percentage>=60){

message=

"👍 Dobrý základ, ještě trochu procvičit.";

}else{

message=

"📚 Doporučení: vrať se do Výuky.";

}


$("finalMessage").textContent=

message;


$("question").textContent=

"Hotovo";


$("progress").textContent="";


$("result").textContent="";


final.classList.remove(

"hidden"

);

}
