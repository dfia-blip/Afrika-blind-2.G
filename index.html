<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afrika – slepá mapa</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f5f7;
    color: #111;
    text-align: center;
}

h1 {
    font-size: clamp(30px, 6vw, 52px);
    margin: 25px 10px 10px;
}

.question {
    font-size: clamp(23px, 5vw, 38px);
    font-weight: 700;
    margin: 10px 15px 20px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin: 15px;
}

button {
    border: none;
    border-radius: 14px;
    padding: 13px 22px;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    background: #ddd;
}

button.active {
    background: #111;
    color: white;
}

button:hover {
    transform: scale(1.02);
}

.info {
    min-height: 40px;
    font-size: 21px;
    font-weight: 600;
    margin: 10px;
}

.score {
    font-size: 20px;
    font-weight: 600;
    margin: 8px;
}

.mapBox {
    width: min(96vw, 1000px);
    height: min(72vh, 850px);
    min-height: 500px;
    margin: 15px auto 25px;
    background: white;
    border-radius: 28px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    overflow: hidden;
    position: relative;
}

svg {
    width: 100%;
    height: 100%;
    display: block;
}

.country {
    fill: #d9d9d9;
    stroke: #888;
    stroke-width: 0.8;
    cursor: pointer;
    transition: fill .15s, stroke .15s;
}

.country:hover {
    fill: #bdbdbd;
    stroke: #333;
    stroke-width: 1.5;
}

.correct {
    fill: #4caf50 !important;
    stroke: #206b2a !important;
    stroke-width: 2 !important;
}

.wrong {
    fill: #e57373 !important;
    stroke: #a50000 !important;
    stroke-width: 2 !important;
}

.answer {
    margin: 12px auto;
    padding: 14px 20px;
    max-width: 700px;
    border-radius: 15px;
    background: #fff3cd;
    font-size: 21px;
    font-weight: 600;
}

.hidden {
    display: none;
}

#nextBtn {
    background: #111;
    color: white;
    padding: 15px 30px;
    font-size: 20px;
    margin: 10px;
}

#restartBtn {
    background: #555;
    color: white;
    padding: 15px 30px;
    font-size: 20px;
    margin: 10px;
}

.result {
    font-size: 28px;
    font-weight: 700;
    margin: 20px;
}

@media (max-width: 600px) {
    .mapBox {
        width: 96vw;
        height: 65vh;
        min-height: 450px;
        border-radius: 22px;
    }

    button {
        font-size: 16px;
        padding: 11px 16px;
    }
}
</style>
</head>

<body>

<h1>🌍 Afrika – slepá mapa</h1>

<div class="controls">
    <button id="learnBtn" class="active">📚 Výuka</button>
    <button id="testBtn">📝 Test</button>
    <button id="restartBtn">🔄 Restart</button>
</div>

<div class="score" id="score"></div>

<div class="question" id="question">
    Načítám mapu…
</div>

<div class="info" id="info"></div>

<div class="mapBox">
    <svg id="map"></svg>
</div>

<div id="answer" class="answer hidden"></div>

<button id="nextBtn" class="hidden">
    Další otázka →
</button>

<div id="result" class="result hidden"></div>


<script>

const svg = d3.select("#map");

let countries = [];
let currentCountry = null;

let mode = "learn";

let score = 0;
let attempts = 0;
let questionNumber = 0;

let answered = false;


/* ============================
   AFRICKÉ STÁTY
============================ */

const africa = new Set([
"Algeria",
"Angola",
"Benin",
"Botswana",
"Burkina Faso",
"Burundi",
"Cabo Verde",
"Cameroon",
"Central African Republic",
"Chad",
"Comoros",
"Republic of the Congo",
"Democratic Republic of the Congo",
"Djibouti",
"Egypt",
"Equatorial Guinea",
"Eritrea",
"Eswatini",
"Ethiopia",
"Gabon",
"Gambia",
"Ghana",
"Guinea",
"Guinea-Bissau",
"Kenya",
"Lesotho",
"Liberia",
"Libya",
"Madagascar",
"Malawi",
"Mali",
"Mauritania",
"Mauritius",
"Morocco",
"Mozambique",
"Namibia",
"Niger",
"Nigeria",
"Rwanda",
"São Tomé and Príncipe",
"Senegal",
"Seychelles",
"Sierra Leone",
"Somalia",
"South Africa",
"South Sudan",
"Sudan",
"Tanzania",
"Togo",
"Tunisia",
"Uganda",
"Zambia",
"Zimbabwe",
"Western Sahara"
]);


/* ============================
   NÁZVY PRO ZOBRAZENÍ
============================ */

const names = {

"Algeria":"Alžírsko",
"Angola":"Angola",
"Benin":"Benin",
"Botswana":"Botswana",
"Burkina Faso":"Burkina Faso",
"Burundi":"Burundi",
"Cabo Verde":"Kapverdy",
"Cameroon":"Kamerun",
"Central African Republic":"Středoafrická republika",
"Chad":"Čad",
"Comoros":"Komory",
"Republic of the Congo":"Republika Kongo",
"Democratic Republic of the Congo":"Demokratická republika Kongo",
"Djibouti":"Džibutsko",
"Egypt":"Egypt",
"Equatorial Guinea":"Rovníková Guinea",
"Eritrea":"Eritrea",
"Eswatini":"Eswatini",
"Ethiopia":"Etiopie",
"Gabon":"Gabon",
"Gambia":"Gambie",
"Ghana":"Ghana",
"Guinea":"Guinea",
"Guinea-Bissau":"Guinea-Bissau",
"Kenya":"Keňa",
"Lesotho":"Lesotho",
"Liberia":"Libérie",
"Libya":"Libye",
"Madagascar":"Madagaskar",
"Malawi":"Malawi",
"Mali":"Mali",
"Mauritania":"Mauritánie",
"Mauritius":"Mauricius",
"Morocco":"Maroko",
"Mozambique":"Mosambik",
"Namibia":"Namibie",
"Niger":"Niger",
"Nigeria":"Nigérie",
"Rwanda":"Rwanda",
"São Tomé and Príncipe":"Svatý Tomáš a Princův ostrov",
"Senegal":"Senegal",
"Seychelles":"Seychely",
"Sierra Leone":"Sierra Leone",
"Somalia":"Somálsko",
"South Africa":"Jihoafrická republika",
"South Sudan":"Jižní Súdán",
"Sudan":"Súdán",
"Tanzania":"Tanzanie",
"Togo":"Togo",
"Tunisia":"Tunisko",
"Uganda":"Uganda",
"Zambia":"Zambie",
"Zimbabwe":"Zimbabwe",
"Western Sahara":"Západní Sahara"
};


/* ============================
   NAČTENÍ KOMPLETNÍ MAPY
============================ */

async function loadMap() {

    try {

        const data = await d3.json(
            "https://cdn.jsdelivr.net/gh/datasets/geo-countries@master/data/countries.geojson"
        );

        countries = data.features.filter(d => {

            const n = d.properties.ADMIN ||
                      d.properties.name ||
                      d.properties.NAME;

            return africa.has(n);
        });

        drawMap();

        startQuestion();

    } catch(error) {

        console.error(error);

        document.getElementById("question").textContent =
            "Mapu se nepodařilo načíst.";

    }
}


/* ============================
   VYKRESLENÍ MAPY
============================ */

function drawMap() {

    svg.selectAll("*").remove();

    const width = svg.node().clientWidth;
    const height = svg.node().clientHeight;

    const collection = {
        type: "FeatureCollection",
        features: countries
    };

    /*
       fitSize zajistí, že se Afrika
       vejde CELÁ do mapového pole.
    */

    const projection = d3.geoMercator()
        .fitSize(
            [width - 30, height - 30],
            collection
        );

    const path = d3.geoPath()
        .projection(projection);

    svg.append("g")
        .attr("transform", "translate(15,15)")
        .selectAll("path")
        .data(countries)
        .join("path")
        .attr("class", "country")
        .attr("d", path)
        .attr("data-name", d =>
            d.properties.ADMIN ||
            d.properties.name ||
            d.properties.NAME
        )
        .on("click", function(event, d) {

            const name =
                d.properties.ADMIN ||
                d.properties.name ||
                d.properties.NAME;

            countryClicked(name, this);
        });
}


/* ============================
   NOVÁ OTÁZKA
============================ */

function startQuestion() {

    answered = false;

    clearMap();

    document.getElementById("answer")
        .classList.add("hidden");

    document.getElementById("nextBtn")
        .classList.add("hidden");

    document.getElementById("result")
        .classList.add("hidden");

    document.getElementById("info").textContent = "";

    if (!countries.length) return;

    currentCountry =
        countries[Math.floor(Math.random() * countries.length)];

    const name =
        currentCountry.properties.ADMIN ||
        currentCountry.properties.name ||
        currentCountry.properties.NAME;

    questionNumber++;

    document.getElementById("question").textContent =
        "Najdi na mapě: " + name;

    updateScore();
}


/* ============================
   KLIKNUTÍ NA STÁT
============================ */

function countryClicked(name, element) {

    if (answered) return;

    attempts++;

    const correctName =
        currentCountry.properties.ADMIN ||
        currentCountry.properties.name ||
        currentCountry.properties.NAME;

    if (name === correctName) {

        score++;

        element.classList.add("correct");

        answered = true;

        document.getElementById("info").textContent =
            "✅ Správně!";

        document.getElementById("nextBtn")
            .classList.remove("hidden");

        updateScore();

    } else {

        element.classList.add("wrong");

        if (mode === "learn") {

            /*
              VE VÝUCE okamžitě ukážeme správnou odpověď.
            */

            showCorrectAnswer(correctName);

            answered = true;

            document.getElementById("nextBtn")
                .classList.remove("hidden");

        } else {

            /*
              V TESTU chyba pouze pokračuje,
              správná odpověď se zatím neukáže.
            */

            document.getElementById("info").textContent =
                "❌ Špatně. Zkus to znovu.";

            /*
              Chybný stát po chvíli odbarvíme,
              aby mohl uživatel pokračovat.
            */

            setTimeout(() => {

                element.classList.remove("wrong");

            }, 700);
        }

        updateScore();
    }

    checkFinished();
}


/* ============================
   SPRÁVNÁ ODPOVĚĎ VE VÝUCE
============================ */

function showCorrectAnswer(correctName) {

    const correctPath =
        svg.select(`path[data-name="${CSS.escape(correctName)}"]`);

    correctPath.classed("correct", true);

    const czechName =
        names[correctName] || correctName;

    document.getElementById("info").textContent =
        "❌ Špatně.";

    const answer = document.getElementById("answer");

    answer.innerHTML =
        "Správná odpověď je: <strong>" +
        czechName +
        "</strong>";

    answer.classList.remove("hidden");
}


/* ============================
   VYMAZÁNÍ BAREV
============================ */

function clearMap() {

    svg.selectAll(".country")
        .classed("correct", false)
        .classed("wrong", false);
}


/* ============================
   DALŠÍ OTÁZKA
============================ */

document.getElementById("nextBtn")
    .addEventListener("click", () => {

        if (mode === "test" && questionNumber >= 20) {

            finishTest();

        } else {

            startQuestion();

        }
    });


/* ============================
   REŽIM VÝUKA
============================ */

document.getElementById("learnBtn")
    .addEventListener("click", () => {

        mode = "learn";

        document.getElementById("learnBtn")
            .classList.add("active");

        document.getElementById("testBtn")
            .classList.remove("active");

        restart();

    });


/* ============================
   REŽIM TEST
============================ */

document.getElementById("testBtn")
    .addEventListener("click", () => {

        mode = "test";

        document.getElementById("testBtn")
            .classList.add("active");

        document.getElementById("learnBtn")
            .classList.remove("active");

        restart();

    });


/* ============================
   RESTART
============================ */

document.getElementById("restartBtn")
    .addEventListener("click", restart);


function restart() {

    score = 0;
    attempts = 0;
    questionNumber = 0;

    document.getElementById("result")
        .classList.add("hidden");

    startQuestion();
}


/* ============================
   SKÓRE
============================ */

function updateScore() {

    if (mode === "test") {

        document.getElementById("score").textContent =
            "Test: otázka " +
            Math.min(questionNumber, 20) +
            " / 20   •   Správně: " +
            score;

    } else {

        document.getElementById("score").textContent =
            "Výuka • Správně: " + score;
    }
}


/* ============================
   KONEC TESTU
============================ */

function checkFinished() {

    if (
        mode === "test" &&
        questionNumber >= 20 &&
        answered
    ) {

        document.getElementById("nextBtn")
            .textContent = "Zobrazit výsledek →";
    }
}


function finishTest() {

    clearMap();

    document.getElementById("question").textContent =
        "🎉 Test dokončen";

    document.getElementById("info").textContent = "";

    document.getElementById("nextBtn")
        .classList.add("hidden");

    const percentage =
        Math.round((score / 20) * 100);

    let text = "";

    if (percentage >= 90) {
        text = "Výborný výsledek! 🏆";
    } else if (percentage >= 75) {
        text = "Velmi dobrý výsledek! 👍";
    } else if (percentage >= 50) {
        text = "Dobrá práce, ale ještě je co procvičit.";
    } else {
        text = "Zkus si nejdřív procvičit státy ve výukovém režimu.";
    }

    const result = document.getElementById("result");

    result.innerHTML =
        text +
        "<br><br>" +
        "Výsledek: <strong>" +
        score +
        " / 20</strong>" +
        "<br>" +
        percentage +
        " %";

    result.classList.remove("hidden");
}


/* ============================
   PŘI ZMĚNĚ VELIKOSTI OKNA
============================ */

window.addEventListener("resize", () => {

    if (countries.length) {
        drawMap();
    }

});


/* START */

loadMap();

</script>

</body>
</html>
