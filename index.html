<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Afrika – slepá mapa</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f5f7;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:#111;
}

.wrap{
  max-width:980px;
  margin:auto;
  padding:18px 14px 40px;
}

h1{
  font-size:clamp(26px,5vw,42px);
  text-align:center;
  margin:8px 0 14px;
}

.top{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-bottom:12px;
}

button{
  border:0;
  border-radius:16px;
  padding:13px 18px;
  font-size:17px;
  font-weight:700;
  background:#333;
  color:white;
  cursor:pointer;
}

button.secondary{
  background:#777;
}

button.active{
  background:#1769aa;
}

button:active{
  transform:scale(.98);
}

.status{
  text-align:center;
  font-size:clamp(20px,4.5vw,30px);
  font-weight:800;
  margin:12px 0;
}

.small{
  text-align:center;
  font-size:16px;
  color:#555;
  min-height:24px;
}

#mapBox{
  background:white;
  border-radius:28px;
  padding:12px;
  margin-top:12px;
  box-shadow:0 2px 14px #00000010;
}

svg{
  display:block;
  width:100%;
  height:auto;
  touch-action:manipulation;
}

.country{
  fill:#d8d8d8;
  stroke:#999;
  stroke-width:.75;
  cursor:pointer;
  transition:fill .12s,stroke .12s;
}

.country:hover{
  fill:#c8c8c8;
}

.correct{
  fill:#58b96a!important;
  stroke:#26783a!important;
  stroke-width:1.4;
}

.wrong{
  fill:#e46a6a!important;
  stroke:#9b2424!important;
}

.answer{
  margin:12px auto 0;
  max-width:700px;
  text-align:center;
  font-size:20px;
  font-weight:800;
  min-height:30px;
}

.good{
  color:#21863a;
}

.bad{
  color:#b3261e;
}

.progress{
  max-width:700px;
  margin:10px auto 0;
  background:#ddd;
  border-radius:99px;
  height:10px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0;
  background:#1769aa;
  transition:width .2s;
}

.loading{
  text-align:center;
  font-size:18px;
  padding:35px;
}

@media(max-width:600px){
  .wrap{
    padding:8px 8px 25px;
  }

  .top button{
    font-size:15px;
    padding:11px 13px;
  }

  .status{
    margin:8px 0;
  }

  .answer{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>🌍 Afrika – slepá mapa</h1>

<div class="top">
  <button id="learnBtn" class="active">📚 Výuka</button>
  <button id="testBtn" class="secondary">📝 Test</button>
  <button id="restartBtn">🔄 Restart</button>
</div>

<div id="status" class="status">
  Načítám mapu…
</div>

<div id="small" class="small"></div>

<div id="mapBox">
  <div class="loading">
    Načítám celou mapu Afriky…
  </div>
</div>

<div id="answer" class="answer"></div>

<div class="progress">
  <div id="bar" class="bar"></div>
</div>

</div>

<script>

const DATA_URL =
"https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json";


/*
  AFRIKA – ISO číselné kódy států
*/

const AFRICAN_ISO = [

"012", /* Alžírsko */
"024", /* Angola */
"072", /* Botswana */
"108", /* Burundi */
"120", /* Kamerun */
"132", /* Kapverdy */
"140", /* Středoafrická republika */
"148", /* Čad */
"174", /* Komory */
"178", /* Konžská republika */
"180", /* Demokratická republika Kongo */
"204", /* Benin */
"226", /* Rovníková Guinea */
"231", /* Etiopie */
"232", /* Eritrea */
"262", /* Džibutsko */
"266", /* Gabon */
"270", /* Gambie */
"288", /* Ghana */
"324", /* Guinea */
"384", /* Pobřeží slonoviny */
"404", /* Keňa */
"426", /* Lesotho */
"430", /* Libérie */
"434", /* Libye */
"450", /* Madagaskar */
"454", /* Malawi */
"466", /* Mali */
"478", /* Mauritánie */
"480", /* Mauricius */
"504", /* Maroko */
"508", /* Mosambik */
"516", /* Namibie */
"562", /* Niger */
"566", /* Nigérie */
"624", /* Guinea-Bissau */
"646", /* Rwanda */
"678", /* Svatý Tomáš a Princův ostrov */
"686", /* Senegal */
"690", /* Seychely */
"694", /* Sierra Leone */
"706", /* Somálsko */
"710", /* Jihoafrická republika */
"716", /* Zimbabwe */
"728", /* Jižní Súdán */
"729", /* Súdán */
"732", /* Západní Sahara */
"748", /* Eswatini */
"768", /* Togo */
"788", /* Tunisko */
"800", /* Uganda */
"818", /* Egypt */
"834", /* Tanzanie */
"854", /* Burkina Faso */
"894"  /* Zambie */

];


/*
  54 afrických států,
  které se používají v testu.
*/

const STATES = [

"012",
"024",
"072",
"108",
"120",
"132",
"140",
"148",
"174",
"178",
"180",
"204",
"226",
"231",
"232",
"262",
"266",
"270",
"288",
"324",
"384",
"404",
"426",
"430",
"434",
"450",
"454",
"466",
"478",
"480",
"504",
"508",
"516",
"562",
"566",
"624",
"646",
"678",
"686",
"690",
"694",
"706",
"710",
"716",
"728",
"729",
"748",
"768",
"788",
"800",
"818",
"834",
"854",
"894"

];


/*
  Názvy států
*/

const STATE_NAMES = {

"012":"Alžírsko",
"024":"Angola",
"072":"Botswana",
"108":"Burundi",
"120":"Kamerun",
"132":"Kapverdy",
"140":"Středoafrická republika",
"148":"Čad",
"174":"Komory",
"178":"Konžská republika",
"180":"Demokratická republika Kongo",
"204":"Benin",
"226":"Rovníková Guinea",
"231":"Etiopie",
"232":"Eritrea",
"262":"Džibutsko",
"266":"Gabon",
"270":"Gambie",
"288":"Ghana",
"324":"Guinea",
"384":"Pobřeží slonoviny",
"404":"Keňa",
"426":"Lesotho",
"430":"Libérie",
"434":"Libye",
"450":"Madagaskar",
"454":"Malawi",
"466":"Mali",
"478":"Mauritánie",
"480":"Mauricius",
"504":"Maroko",
"508":"Mosambik",
"516":"Namibie",
"562":"Niger",
"566":"Nigérie",
"624":"Guinea-Bissau",
"646":"Rwanda",
"678":"Svatý Tomáš a Princův ostrov",
"686":"Senegal",
"690":"Seychely",
"694":"Sierra Leone",
"706":"Somálsko",
"710":"Jihoafrická republika",
"716":"Zimbabwe",
"728":"Jižní Súdán",
"729":"Súdán",
"748":"Eswatini",
"768":"Togo",
"788":"Tunisko",
"800":"Uganda",
"818":"Egypt",
"834":"Tanzanie",
"854":"Burkina Faso",
"894":"Zambie"

};


let svg;
let path;
let countries;

let mode = "learn";

let current = null;

let score = 0;
let answered = 0;

let locked = false;


const status =
document.getElementById("status");

const small =
document.getElementById("small");

const answer =
document.getElementById("answer");

const bar =
document.getElementById("bar");


/*
  Tlačítka
*/

document.getElementById("learnBtn").onclick =
function(){
  setMode("learn");
};

document.getElementById("testBtn").onclick =
function(){
  setMode("test");
};

document.getElementById("restartBtn").onclick =
function(){
  restart();
};


/*
  Přepnutí režimu
*/

function setMode(m){

  mode = m;

  document.getElementById("learnBtn").className =
    m === "learn"
    ? "active"
    : "secondary";

  document.getElementById("testBtn").className =
    m === "test"
    ? "active"
    : "secondary";

  restart();
}


/*
  Restart
*/

function restart(){

  score = 0;

  answered = 0;

  locked = false;

  answer.textContent = "";

  answer.className = "answer";

  nextQuestion();
}


/*
  Nová otázka
*/

function nextQuestion(){

  if(!countries){
    return;
  }

  countries
    .classed("correct",false)
    .classed("wrong",false);

  locked = false;

  current =
    STATES[
      Math.floor(
        Math.random() * STATES.length
      )
    ];

  status.textContent =
    (mode === "learn" ? "Výuka" : "Test")
    + " • Správně: "
    + score;

  small.textContent =
    "Najdi na mapě: "
    + STATE_NAMES[current];

  answer.textContent = "";

  answer.className = "answer";

  bar.style.width =
    Math.min(
      100,
      (answered / STATES.length) * 100
    ) + "%";
}


/*
  Kliknutí na stát
*/

function clickCountry(d,el){

  if(locked || !current){
    return;
  }

  const id =
    String(d.id).padStart(3,"0");

  const name =
    STATE_NAMES[id] ||
    d.properties?.name ||
    id;


  /*
    SPRÁVNÁ ODPOVĚĎ
  */

  if(id === current){

    score++;

    answered++;

    d3.select(el)
      .classed("correct",true);

    answer.textContent =
      "✓ Správně – "
      + STATE_NAMES[current];

    answer.className =
      "answer good";

    locked = true;

    status.textContent =
      (mode === "learn" ? "Výuka" : "Test")
      + " • Správně: "
      + score;

    bar.style.width =
      Math.min(
        100,
        (answered / STATES.length) * 100
      ) + "%";


    /*
      Pokud je test dokončen
    */

    if(
      mode === "test" &&
      answered >= STATES.length
    ){

      setTimeout(function(){

        status.textContent =
          "Test dokončen • "
          + score
          + " / "
          + STATES.length;

        small.textContent =
          "Úspěšnost: "
          + Math.round(
              score / STATES.length * 100
            )
          + " %";

        answer.textContent =
          "🏆 Test dokončen!";

        answer.className =
          "answer good";

      },500);

      return;
    }


    setTimeout(
      nextQuestion,
      mode === "test" ? 650 : 900
    );

  }


  /*
    ŠPATNÁ ODPOVĚĎ
  */

  else{

    answered++;

    d3.select(el)
      .classed("wrong",true);


    if(mode === "learn"){

      const target =
        countries.filter(function(x){

          return String(x.id)
            .padStart(3,"0")
            === current;

        });


      /*
        Ukáže správnou odpověď
      */

      target.classed(
        "correct",
        true
      );

      answer.textContent =
        "✗ Správně je: "
        + STATE_NAMES[current];

      answer.className =
        "answer bad";

      locked = true;


      setTimeout(
        nextQuestion,
        1300
      );

    }

    else{

      status.textContent =
        "Test • Správně: "
        + score;

      setTimeout(function(){

        d3.select(el)
          .classed("wrong",false);

      },350);

    }


    bar.style.width =
      Math.min(
        100,
        (answered / STATES.length) * 100
      ) + "%";

  }

}


/*
  Načtení mapy
*/

async function loadMap(){

  try{

    const topo =
      await d3.json(DATA_URL);

    const all =
      topojson
        .feature(
          topo,
          topo.objects.countries
        )
        .features;


    /*
      Vybereme pouze Afriku.
    */

    const africa =
      all.filter(function(d){

        return AFRICAN_ISO.includes(
          String(d.id).padStart(3,"0")
        );

      });


    if(!africa.length){

      throw new Error(
        "Africké státy nebyly nalezeny."
      );

    }


    document.getElementById(
      "mapBox"
    ).innerHTML = "";


    const width = 920;

    const height = 1120;


    svg =
      d3.select("#mapBox")
        .append("svg")
        .attr(
          "viewBox",
          "0 0 "
          + width
          + " "
          + height
        )
        .attr(
          "role",
          "img"
        )
        .attr(
          "aria-label",
          "Slepá mapa Afriky"
        );


    const fc = {

      type:"FeatureCollection",

      features:africa

    };


    /*
      Projekce se přizpůsobí celé Africe.
      Díky tomu se mapa nevřízne.
    */

    const projection =
      d3.geoMercator()
        .fitExtent(
          [
            [30,30],
            [width-30,height-30]
          ],
          fc
        );


    path =
      d3.geoPath(projection);


    /*
      Vykreslení států
    */

    countries =
      svg
        .selectAll("path.country")
        .data(africa)
        .join("path")
        .attr(
          "class",
          "country"
        )
        .attr(
          "d",
          path
        )
        .on(
          "click",
          function(event,d){

            clickCountry(
              d,
              event.currentTarget
            );

          }
        );


    /*
      Spustit první otázku
    */

    restart();

  }

  catch(e){

    document.getElementById(
      "mapBox"
    ).innerHTML =
      '<div class="loading">'
      + 'Mapu se nepodařilo načíst.<br>'
      + 'Zkontroluj internetové připojení '
      + 'a obnov stránku.'
      + '</div>';


    status.textContent =
      "Chyba při načítání mapy";

    small.textContent =
      e.message;

    console.error(e);

  }

}


/*
  START
*/

loadMap();

</script>

</body>
</html>
