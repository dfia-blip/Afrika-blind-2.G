<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afrika – slepá mapa</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    text-align: center;
}

h1 {
    font-size: 30px;
    margin: 22px 10px 12px;
}

#question {
    font-size: 23px;
    font-weight: bold;
    margin: 10px;
}

#map {
    width: 96%;
    max-width: 850px;
    margin: 15px auto;
    background: white;
    border-radius: 18px;
    padding: 8px;
    box-sizing: border-box;
    box-shadow: 0 3px 15px #ccc;
}

svg {
    width: 100%;
    height: auto;
    display: block;
}

.country {
    fill: #dddddd;
    stroke: #555;
    stroke-width: 0.7;
    cursor: pointer;
}

.country:hover {
    fill: #b9d9f5;
}

.correct {
    fill: #55b957 !important;
}

.wrong {
    fill: #e57373 !important;
}

#message {
    min-height: 30px;
    font-size: 20px;
    font-weight: bold;
    margin: 10px;
}

button {
    margin: 12px 5px 25px;
    padding: 13px 24px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: #1976d2;
    color: white;
}

button:disabled {
    background: #aaa;
}
</style>
</head>

<body>

<h1>🌍 Afrika – slepá mapa</h1>

<div id="question">Načítám mapu…</div>

<div id="map"></div>

<div id="message"></div>

<button id="next" onclick="newQuestion()" disabled>
Další otázka
</button>

<script>

const afrika = [
"Algeria",
"Angola",
"Benin",
"Botswana",
"Burkina Faso",
"Burundi",
"Cabo Verde",
"Cameroon",
"Central African Republic",
"Chad",
"Comoros",
"Democratic Republic of the Congo",
"Republic of the Congo",
"Côte d'Ivoire",
"Djibouti",
"Egypt",
"Equatorial Guinea",
"Eritrea",
"Eswatini",
"Ethiopia",
"Gabon",
"Gambia",
"Ghana",
"Guinea",
"Guinea-Bissau",
"Kenya",
"Lesotho",
"Liberia",
"Libya",
"Madagascar",
"Malawi",
"Mali",
"Mauritania",
"Mauritius",
"Morocco",
"Mozambique",
"Namibia",
"Niger",
"Nigeria",
"Rwanda",
"São Tomé and Príncipe",
"Senegal",
"Seychelles",
"Sierra Leone",
"Somalia",
"South Africa",
"South Sudan",
"Sudan",
"Tanzania",
"Togo",
"Tunisia",
"Uganda",
"Zambia",
"Zimbabwe"
];

let countries = [];
let currentQuestion = "";
let answered = false;

const width = 820;
const height = 720;

const svg = d3.select("#map")
    .append("svg")
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("preserveAspectRatio", "xMidYMid meet");

const path = d3.geoPath();

async function loadMap() {

    try {

        const world = await d3.json(
            "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
        );

        let allCountries = topojson.feature(
            world,
            world.objects.countries
        ).features;

        // Názvy, které se mohou lišit mezi datovými zdroji
        const aliases = {
            "Côte d'Ivoire": "Côte d'Ivoire",
            "Cote d'Ivoire": "Côte d'Ivoire",
            "São Tomé and Príncipe": "São Tomé and Príncipe"
        };

        countries = allCountries.filter(c => {

            let name = c.properties.name;

            if (aliases[name]) {
                name = aliases[name];
            }

            return afrika.includes(name);
        });

        // Pokud datový zdroj používá jiný název, zobrazíme ho
        console.log("Počet afrických států:", countries.length);
        console.log(countries.map(c => c.properties.name));

        // Afrika jako jeden celek pro správné automatické měřítko
        const africaCollection = {
            type: "FeatureCollection",
            features: countries
        };

        const projection = d3.geoMercator()
            .fitExtent(
                [[25, 20], [width - 25, height - 20]],
                africaCollection
            );

        path.projection(projection);

        drawMap();

        newQuestion();

    } catch (error) {

        document.getElementById("question").textContent =
            "Mapu se nepodařilo načíst.";

        console.error(error);
    }
}

function drawMap() {

    svg.selectAll(".country")
        .data(countries)
        .enter()
        .append("path")
        .attr("class", "country")
        .attr("d", path)
        .attr("data-country", d => d.properties.name)
        .on("click", function(event, d) {

            if (answered) return;

            const name = d.properties.name;

            if (name === currentQuestion) {

                d3.select(this)
                    .classed("correct", true);

                document.getElementById("message").textContent =
                    "✅ Správně!";

                answered = true;

                document.getElementById("next").disabled = false;

            } else {

                d3.select(this)
                    .classed("wrong", true);

                document.getElementById("message").textContent =
                    "❌ To není " + currentQuestion + ". Zkus znovu.";

                setTimeout(() => {
                    d3.select(this)
                        .classed("wrong", false);
                }, 700);
            }
        });
}

function newQuestion() {

    answered = false;

    document.getElementById("next").disabled = true;
    document.getElementById("message").textContent = "";

    svg.selectAll(".country")
        .classed("correct", false)
        .classed("wrong", false);

    currentQuestion =
        afrika[Math.floor(Math.random() * afrika.length)];

    document.getElementById("question").textContent =
        "Najdi na mapě: " + currentQuestion;
}

loadMap();

</script>

</body>
</html>
