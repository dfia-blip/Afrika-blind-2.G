<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SMVV – Zeměpis – 2.G – Afrika</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f5f7;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  text-align:center
}

header{
  padding:12px 10px 4px
}

h1{
  font-size:25px;
  margin:5px 0
}

h2{
  font-size:22px;
  margin:5px 0 12px
}

.sub{
  color:#666;
  font-size:15px
}

.controls,
.choices{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin:10px
}

button{
  border:0;
  border-radius:22px;
  padding:12px 17px;
  font-size:17px;
  font-weight:750;
  background:#ddd;
  color:#111;
  cursor:pointer
}

button.active{
  background:#111;
  color:#fff
}

button:disabled{
  opacity:.4;
  cursor:not-allowed
}

#settings{
  background:#fff;
  border-radius:18px;
  padding:10px;
  margin:8px auto;
  max-width:850px
}

#questionCount button{
  font-size:15px;
  padding:9px 13px
}

#stats{
  display:flex;
  justify-content:center;
  gap:16px;
  flex-wrap:wrap;
  font-size:17px;
  font-weight:750;
  margin:9px
}

#question{
  font-size:25px;
  font-weight:800;
  margin:14px 8px 5px
}

#progress{
  font-size:16px;
  color:#555;
  font-weight:650
}

#result{
  min-height:42px;
  font-size:18px;
  font-weight:750;
  margin:9px
}

#mapBox{
  width:calc(100% - 16px);
  max-width:900px;
  margin:8px auto 22px;
  background:#fff;
  border-radius:25px;
  padding:5px;
  overflow:hidden;
  box-shadow:0 3px 18px #00000010
}

svg{
  display:block;
  width:100%;
  height:auto
}

.country{
  fill:#d9d9d9;
  stroke:#858585;
  stroke-width:.7
}

.country.correct{
  fill:#64c174;
  stroke:#347c43;
  stroke-width:1.5
}

.country.wrong{
  fill:#e57373;
  stroke:#a52e2e;
  stroke-width:1.5
}

.country.answer{
  fill:#64c174;
  stroke:#347c43;
  stroke-width:2
}

.hit{
  fill:transparent;
  stroke:transparent;
  cursor:pointer
}

.optionMarker{
  cursor:pointer
}

.optionCircle{
  fill:#2d78b7;
  fill-opacity:.9;
  stroke:#fff;
  stroke-width:2.5
}

.optionCircle.correct{
  fill:#64c174
}

.optionCircle.wrong{
  fill:#e57373
}

.optionLabel{
  fill:#fff;
  font-size:15px;
  font-weight:800;
  pointer-events:none
}

#legend{
  font-size:14px;
  color:#666;
  margin:0 8px 10px
}

#final{
  background:#fff;
  max-width:620px;
  margin:15px auto 25px;
  padding:22px;
  border-radius:22px
}

.finalPercent{
  font-size:42px;
  font-weight:900;
  margin:8px
}

.finalLine{
  font-size:20px;
  font-weight:750;
  margin:7px
}

.hidden{
  display:none!important
}

#loading{
  font-size:20px;
  padding:30px
}

@media(max-width:600px){

  h1{
    font-size:22px
  }

  #question{
    font-size:23px
  }

  button{
    font-size:16px;
    padding:11px 15px
  }

  #mapBox{
    width:calc(100% - 10px);
    border-radius:21px
  }
}
</style>
</head>

<div id="question">

<div id="progress"></div>


<div id="result"></div>

</div>

<svg id="map"></svg>

<div id="legend">

<div id="final" class="hidden">

<h2>🎉 Písemka dokončena</h2>

<div class="finalPercent">

<div class="finalLine">

<div id="finalMessage" class="finalLine"></div>

<div class="controls">

<button id="againBtn">

</button>

<button id="learnAgainBtn">

</button>

</div>

</div>
