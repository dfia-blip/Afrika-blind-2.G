<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afrika – slepá mapa</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f5f7;
    color: #111;
    text-align: center;
}

h1 {
    font-size: 28px;
    margin: 18px 10px 10px;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin: 18px 10px;
}

button {
    border: none;
    border-radius: 24px;
    padding: 15px 25px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    background: #ddd;
}

button.active {
    background: #111;
    color: white;
}

#restart {
    background: #666;
    color: white;
    margin: 10px auto 18px;
}

#info {
    font-size: 22px;
    font-weight: 700;
    margin: 12px;
}

#question {
    font-size: 27px;
    font-weight: 800;
    margin: 18px 10px 22px;
}

#result {
    min-height: 35px;
    font-size: 21px;
    font-weight: 700;
    margin: 10px;
}

#mapBox {
    width: calc(100% - 24px);
    max-width: 850px;
    margin: 0 auto 30px;
    background: white;
    border-radius: 28px;
    padding: 12px;
    overflow: hidden;
}

svg {
    display: block;
    width: 100%;
    height: auto;
}

.country {
    fill: #d9d9d9;
    stroke: #888;
    stroke-width: 0.7;
    cursor: pointer;
    transition: fill 0.15s;
}

.country:hover {
    fill: #c4c4c4;
}

.country.correct {
    fill: #63c174;
    stroke: #398348;
    stroke-width: 1.3;
}

.country.wrong {
    fill: #e57373;
    stroke: #a33;
    stroke-width: 1.3;
}

.country.answer {
    fill: #63c174;
    stroke: #398348;
    stroke-width: 1.5;
}

.country.selected {
    fill: #777;
}

.island {
    fill: #d9d9d9;
}

#score {
    font-size: 22px;
    font-weight: 800;
    margin: 8px;
}

#loading {
    font-size: 20px;
    padding: 30px;
}

.hidden {
    display: none;
}

@media (max-width: 600px) {

    h1 {
        font-size: 25px;
    }

    button {
        font-size: 18px;
        padding: 14px 22px;
    }

    #question {
        font-size: 24px;
    }

    #mapBox {
        width: calc(100% - 18px);
        padding: 7px;
        border-radius: 22px;
    }
}
</style>
</head>

<body>

<h1>🌍 Afrika – slepá mapa</h1>

<div class="controls">

    <button id="learnBtn" class="active">
        📚 Výuka
    </button>

    <button id="testBtn">
        📝 Test
    </button>

</div>

<button id="restart">
    🔄 Restart
</button>

<div id="info">
    <span id="modeText">Výuka</span>
    • Správně: <span id="correct">0</span>
</div>

<div id="score" class="hidden">
    Úspěšnost: <span id="percent">0</span> %
</div>

<div id="question">
    Načítám mapu…
</div>

<div id="result"></div>

<div id="mapBox">
    <div id="loading">
        Načítám správnou mapu Afriky…
    </div>

    <svg id="map"></svg>
</div>


<script>

/* =========================================================
   NASTAVENÍ
========================================================= */

const AFRICAN_COUNTRIES = new Set([

    "Algeria",
    "Angola",
    "Benin",
    "Botswana",
    "Burkina Faso",
    "Burundi",
    "Cameroon",
    "Central African Republic",
    "Chad",
    "Comoros",
    "Democratic Republic of the Congo",
    "Republic of the Congo",
    "Djibouti",
    "Egypt",
    "Equatorial Guinea",
    "Eritrea",
    "Eswatini",
    "Ethiopia",
    "Gabon",
    "Gambia",
    "Ghana",
    "Guinea",
    "Guinea-Bissau",
    "Ivory Coast",
    "Côte d'Ivoire",
    "Kenya",
    "Lesotho",
    "Liberia",
    "Libya",
    "Madagascar",
    "Malawi",
    "Mali",
    "Mauritania",
    "Mauritius",
    "Morocco",
    "Mozambique",
    "Namibia",
    "Niger",
    "Nigeria",
    "Rwanda",
    "São Tomé and Príncipe",
    "Senegal",
    "Seychelles",
    "Sierra Leone",
    "Somalia",
    "South Africa",
    "South Sudan",
    "Sudan",
    "Tanzania",
    "Togo",
    "Tunisia",
    "Uganda",
    "Zambia",
    "Zimbabwe",

    /* přidáno pro zobrazení západní Sahary */
    "Western Sahara"

]);


/* =========================================================
   PROMĚNNÉ
========================================================= */

let mode = "learn";

let countries = [];

let currentCountry = null;

let correct = 0;
let attempts = 0;

let locked = false;

let svg;
let path;


/* =========================================================
   PRVKY
========================================================= */

const learnBtn = document.getElementById("learnBtn");
const testBtn = document.getElementById("testBtn");
const restartBtn = document.getElementById("restart");

const modeText = document.getElementById("modeText");
const correctEl = document.getElementById("correct");

const scoreEl = document.getElementById("score");
const percentEl = document.getElementById("percent");

const questionEl = document.getElementById("question");
const resultEl = document.getElementById("result");

const loadingEl = document.getElementById("loading");

svg = d3.select("#map");


/* =========================================================
   MAPA
========================================================= */

async function loadMap() {

    try {

        /*
         * 50m mapa Natural Earth.
         * Je výrazně vhodnější pro výukovou mapu Afriky.
         */
        const world = await d3.json(
            "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json"
        );

        const allCountries =
            topojson.feature(
                world,
                world.objects.countries
            ).features;


        countries = allCountries.filter(d => {

            const name = d.properties.name;

            return AFRICAN_COUNTRIES.has(name);

        });


        /*
         * Pokud se některý stát jmenuje v datech jinak,
         * upozorníme v konzoli místo toho, aby mapa zmizela.
         */

        console.log(
            "Počet afrických států nalezených v datech:",
            countries.length
        );

        console.log(
            "Státy:",
            countries.map(d => d.properties.name)
        );


        drawMap();

        loadingEl.style.display = "none";

        startRound();

    } catch (error) {

        console.error(error);

        loadingEl.innerHTML =
            "❌ Mapu se nepodařilo načíst.<br><br>" +
            "Zkontroluj připojení k internetu.";

    }

}


/* =========================================================
   VYKRESLENÍ MAPY
========================================================= */

function drawMap() {

    const box =
        document.getElementById("mapBox");

    const width =
        Math.min(
            box.clientWidth - 14,
            850
        );

    /*
     * Poměr stran mapy.
     * Výška je záměrně větší, aby se Afrika
     * na telefonu nezmáčkla.
     */
    const height =
        width * 1.32;


    svg
        .attr("viewBox", `0 0 ${width} ${height}`)
        .attr("width", width)
        .attr("height", height);


    /*
     * Natural Earth projekce.
     * Fitujeme přímo podle Afriky,
     * takže se mapa automaticky vejde
     * a nic se neusekne.
     */

    const collection = {
        type: "FeatureCollection",
        features: countries
    };


    const projection =
        d3.geoNaturalEarth1()
          .fitExtent(
              [
                  [8, 8],
                  [width - 8, height - 8]
              ],
              collection
          );


    path = d3.geoPath()
             .projection(projection);


    svg.selectAll("*").remove();


    /*
     * Všechny africké státy
     */
    svg
        .selectAll(".country")
        .data(countries)
        .enter()
        .append("path")
        .attr("class", "country")
        .attr("d", path)
        .attr("data-name", d =>
            d.properties.name
        )
        .on("click", function(event, d) {

            handleCountryClick(d);

        });


    /*
     * Debug:
     * pokud se některá země nevykreslí,
     * vypíše se do konzole její název.
     */

}


/* =========================================================
   VÝBĚR STÁTU
========================================================= */

function handleCountryClick(country) {

    if (locked) return;

    const clickedName =
        country.properties.name;

    const correctName =
        currentCountry.properties.name;


    if (clickedName === correctName) {

        correct++;
        attempts++;

        correctEl.textContent = correct;

        d3.select(
            `path[data-name="${CSS.escape(clickedName)}"]`
        )
        .classed("correct", true);


        resultEl.textContent =
            "✅ Správně!";

        resultEl.style.color =
            "#25833b";


        if (mode === "test") {

            updateScore();

        }


        locked = true;

        setTimeout(() => {

            clearColors();

            startRound();

        }, 900);


    } else {

        attempts++;

        d3.select(
            `path[data-name="${CSS.escape(clickedName)}"]`
        )
        .classed("wrong", true);


        if (mode === "learn") {

            /*
             * VE VÝUCE ukážeme správnou odpověď.
             */

            d3.select(
                `path[data-name="${CSS.escape(correctName)}"]`
            )
            .classed("answer", true);


            resultEl.innerHTML =
                "❌ To není " +
                clickedName +
                ".<br>" +
                "✅ Správně je označený stát: " +
                correctName;

            resultEl.style.color =
                "#b3261e";


            locked = true;

            setTimeout(() => {

                clearColors();

                startRound();

            }, 2200);


        } else {

            /*
             * V TESTU pouze označíme chybu.
             * Správnou odpověď zatím neprozradíme.
             */

            resultEl.textContent =
                "❌ Špatně – zkus to znovu.";

            resultEl.style.color =
                "#b3261e";


            updateScore();

        }

    }

}


/* =========================================================
   NOVÁ OTÁZKA
========================================================= */

function startRound() {

    if (!countries.length) return;


    locked = false;

    resultEl.textContent = "";

    clearColors();


    /*
     * Náhodný stát
     */
    currentCountry =
        countries[
            Math.floor(
                Math.random() * countries.length
            )
        ];


    const name =
        currentCountry.properties.name;


    questionEl.textContent =
        "Najdi na mapě: " + name;


    if (mode === "learn") {

        modeText.textContent =
            "Výuka";

    } else {

        modeText.textContent =
            "Test";

    }

}


/* =========================================================
   VYČIŠTĚNÍ BAREV
========================================================= */

function clearColors() {

    svg
        .selectAll(".country")
        .classed("correct", false)
        .classed("wrong", false)
        .classed("answer", false)
        .classed("selected", false);

}


/* =========================================================
   ÚSPĚŠNOST
========================================================= */

function updateScore() {

    if (attempts === 0) {

        percentEl.textContent = "0";

        return;

    }


    const percentage =
        Math.round(
            (correct / attempts) * 100
        );


    percentEl.textContent =
        percentage;

}


/* =========================================================
   PŘEPNUTÍ NA VÝUKU
========================================================= */

learnBtn.addEventListener("click", () => {

    mode = "learn";

    learnBtn.classList.add("active");
    testBtn.classList.remove("active");

    scoreEl.classList.add("hidden");

    correct = 0;
    attempts = 0;

    correctEl.textContent = "0";

    clearColors();

    startRound();

});


/* =========================================================
   PŘEPNUTÍ NA TEST
========================================================= */

testBtn.addEventListener("click", () => {

    mode = "test";

    testBtn.classList.add("active");
    learnBtn.classList.remove("active");

    scoreEl.classList.remove("hidden");

    correct = 0;
    attempts = 0;

    correctEl.textContent = "0";
    percentEl.textContent = "0";

    clearColors();

    startRound();

});


/* =========================================================
   RESTART
========================================================= */

restartBtn.addEventListener("click", () => {

    correct = 0;
    attempts = 0;

    correctEl.textContent = "0";
    percentEl.textContent = "0";

    resultEl.textContent = "";

    clearColors();

    startRound();

});


/* =========================================================
   PŘIZPŮSOBENÍ TELEFONU
========================================================= */

window.addEventListener(
    "resize",
    () => {

        if (countries.length) {

            drawMap();

        }

    }
);


/* =========================================================
   START
========================================================= */

loadMap();

</script>

</body>
</html>
