<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afrika – slepá mapa</title>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    text-align: center;
}

h1 {
    font-size: 32px;
    margin: 28px 10px 15px;
}

#question {
    font-size: 26px;
    font-weight: bold;
    margin: 10px 10px 25px;
}

#map {
    width: 94%;
    max-width: 800px;
    margin: auto;
    background: white;
    border-radius: 20px;
    padding: 10px;
    box-sizing: border-box;
    box-shadow: 0 3px 15px #ccc;
}

svg {
    width: 100%;
    height: auto;
    display: block;
}

.country {
    fill: #e3e3e3;
    stroke: #777;
    stroke-width: 0.7;
    cursor: pointer;
    transition: fill 0.15s;
}

.country:hover {
    fill: #b9d9f5;
}

.correct {
    fill: #59b957 !important;
}

.wrong {
    fill: #e57373 !important;
}

button {
    margin: 20px 5px;
    padding: 14px 25px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: #1976d2;
    color: white;
}

button:disabled {
    background: #aaa;
}

#message {
    min-height: 30px;
    font-size: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🌍 Afrika – slepá mapa</h1>

<div id="question">Načítám mapu…</div>

<div id="map"></div>

<div id="message"></div>

<button id="next" onclick="newQuestion()" disabled>
Další otázka
</button>

<script>

const afrika = [
"Algeria",
"Angola",
"Benin",
"Botswana",
"Burkina Faso",
"Burundi",
"Cabo Verde",
"Cameroon",
"Central African Republic",
"Chad",
"Comoros",
"Democratic Republic of the Congo",
"Republic of the Congo",
"Cote d'Ivoire",
"Djibouti",
"Egypt",
"Equatorial Guinea",
"Eritrea",
"Eswatini",
"Ethiopia",
"Gabon",
"Gambia",
"Ghana",
"Guinea",
"Guinea-Bissau",
"Kenya",
"Lesotho",
"Liberia",
"Libya",
"Madagascar",
"Malawi",
"Mali",
"Mauritania",
"Mauritius",
"Morocco",
"Mozambique",
"Namibia",
"Niger",
"Nigeria",
"Rwanda",
"São Tomé and Príncipe",
"Senegal",
"Seychelles",
"Sierra Leone",
"Somalia",
"South Africa",
"South Sudan",
"Sudan",
"Tanzania",
"Togo",
"Tunisia",
"Uganda",
"Zambia",
"Zimbabwe"
];

let countries = [];
let currentQuestion = "";
let answered = false;

const width = 800;
const height = 900;

const svg = d3.select("#map")
    .append("svg")
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("preserveAspectRatio", "xMidYMid meet");

const projection = d3.geoMercator()
    .center([20, 2])
    .scale(480)
    .translate([width / 2, height / 2]);

const path = d3.geoPath()
    .projection(projection);

async function loadMap() {

    try {

        const world = await d3.json(
            "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
        );

        countries = topojson.feature(
            world,
            world.objects.countries
        ).features;

        countries = countries.filter(c =>
            afrika.includes(c.properties.name)
        );

        drawMap();

        newQuestion();

    } catch (error) {

        document.getElementById("question").textContent =
            "Mapu se nepodařilo načíst.";

        console.error(error);
    }
}

function drawMap() {

    svg.selectAll(".country")
        .data(countries)
        .enter()
        .append("path")
        .attr("class", "country")
        .attr("d", path)
        .attr("data-country", d => d.properties.name)
        .on("click", function(event, d) {

            if (answered) return;

            const name = d.properties.name;

            if (name === currentQuestion) {

                d3.select(this)
                    .classed("correct", true);

                document.getElementById("message").textContent =
                    "✅ Správně!";

                answered = true;

                document.getElementById("next").disabled = false;

            } else {

                d3.select(this)
                    .classed("wrong", true);

                document.getElementById("message").textContent =
                    "❌ To není " + currentQuestion + ". Zkus znovu.";

                setTimeout(() => {
                    d3.select(this)
                        .classed("wrong", false);
                }, 700);
            }
        });
}

function newQuestion() {

    answered = false;

    document.getElementById("next").disabled = true;
    document.getElementById("message").textContent = "";

    svg.selectAll(".country")
        .classed("correct", false)
        .classed("wrong", false);

    currentQuestion =
        afrika[Math.floor(Math.random() * afrika.length)];

    document.getElementById("question").textContent =
        "Najdi na mapě: " + currentQuestion;
}

loadMap();

</script>

</body>
</html>
