<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afrika – slepá mapa</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
  text-align: center;
}

h1 {
  margin-bottom: 5px;
}

#question {
  font-size: 24px;
  font-weight: bold;
  margin: 20px 0;
}

#map {
  width: 95%;
  max-width: 700px;
  margin: auto;
}

svg {
  width: 100%;
  height: auto;
}

.country {
  fill: #d9d9d9;
  stroke: #555;
  stroke-width: 1.5;
  cursor: pointer;
}

.country:hover {
  fill: #bdbdbd;
}

.correct {
  fill: #69b96b !important;
}

.wrong {
  fill: #e57373 !important;
}

button {
  font-size: 18px;
  padding: 12px 20px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: #1976d2;
  color: white;
}

#result {
  font-size: 20px;
  min-height: 30px;
}

#score {
  font-size: 18px;
}
</style>
</head>

<body>

<h1>🌍 Afrika – slepá mapa</h1>

<div id="score">Správně: 0 | Chybně: 0</div>

<div id="question">
  Která země je označena?
</div>

<div id="map">

<svg viewBox="0 0 600 700">

<!-- Afrika – zjednodušená mapa -->
<path class="country" id="maroko"
d="M170 90 L230 80 L250 120 L220 145 L180 135 Z"/>

<path class="country" id="alzir"
d="M230 80 L330 75 L350 170 L250 170 L250 120 Z"/>

<path class="country" id="tunisko"
d="M330 75 L355 80 L360 120 L340 135 Z"/>

<path class="country" id="libye"
d="M355 80 L420 100 L430 190 L350 170 Z"/>

<path class="country" id="egypt"
d="M420 100 L475 110 L470 190 L430 190 Z"/>

<path class="country" id="mauritanie"
d="M180 135 L250 170 L235 245 L160 230 Z"/>

<path class="country" id="mali"
d="M250 170 L350 170 L335 250 L235 245 Z"/>

<path class="country" id="niger"
d="M350 170 L430 190 L410 260 L335 250 Z"/>

<path class="country" id="cad"
d="M430 190 L475 190 L470 280 L410 260 Z"/>

<path class="country" id="senegal"
d="M160 230 L205 235 L200 275 L150 265 Z"/>

<path class="country" id="guinea"
d="M200 275 L250 270 L260 320 L205 315 Z"/>

<path class="country" id="nigerie"
d="M260 270 L335 250 L350 330 L280 350 Z"/>

<path class="country" id="kamerun"
d="M350 330 L410 300 L430 360 L380 390 Z"/>

<path class="country" id="stredoafricka"
d="M410 260 L470 280 L475 350 L430 360 L410 300 Z"/>

<path class="country" id="etiopie"
d="M475 190 L530 230 L515 300 L470 280 Z"/>

<path class="country" id="somalsko"
d="M530 230 L570 290 L520 360 L515 300 Z"/>

<path class="country" id="uganda"
d="M430 360 L475 350 L480 410 L440 420 Z"/>

<path class="country" id="kena"
d="M480 410 L520 360 L540 430 L500 465 Z"/>

<path class="country" id="tanzanie"
d="M440 420 L500 465 L480 540 L420 500 Z"/>

<path class="country" id="angola"
d="M280 350 L380 390 L370 500 L300 480 Z"/>

<path class="country" id="zambie"
d="M370 500 L420 500 L440 560 L380 570 Z"/>

<path class="country" id="zimbabwe"
d="M440 560 L490 550 L500 610 L450 620 Z"/>

<path class="country" id="namibie"
d="M300 480 L370 500 L380 620 L320 650 Z"/>

<path class="country" id="bocwana"
d="M380 570 L450 620 L430 670 L370 620 Z"/>

<path class="country" id="jafrika"
d="M320 650 L430 670 L450 690 L340 695 Z"/>

<path class="country" id="mosambik"
d="M500 465 L540 430 L550 560 L490 610 Z"/>

</svg>
</div>

<div id="result"></div>

<button onclick="newQuestion()">Další otázka</button>

<script>

const countries = {
  maroko: "Maroko",
  alzir: "Alžírsko",
  tunisko: "Tunisko",
  libye: "Libye",
  egypt: "Egypt",
  mauritanie: "Mauritánie",
  mali: "Mali",
  niger: "Niger",
  cad: "Čad",
  senegal: "Senegal",
  guinea: "Guinea",
  nigerie: "Nigérie",
  kamerun: "Kamerun",
  stredoafricka: "Středoafrická republika",
  etiopie: "Etiopie",
  somalsko: "Somálsko",
  uganda: "Uganda",
  kena: "Keňa",
  tanzanie: "Tanzanie",
  angola: "Angola",
  zambie: "Zambie",
  zimbabwe: "Zimbabwe",
  namibie: "Namibie",
  botswana: "Botswana",
  jafrika: "Jihoafrická republika",
  mosambik: "Mosambik"
};

let correct = 0;
let wrong = 0;
let answer = "";

function newQuestion() {

  document.querySelectorAll(".country").forEach(c => {
    c.classList.remove("correct", "wrong");
  });

  const ids = Object.keys(countries);
  answer = ids[Math.floor(Math.random() * ids.length)];

  document.getElementById("question").textContent =
    "Najdi na mapě: " + countries[answer];

  document.getElementById("result").textContent = "";
}

document.querySelectorAll(".country").forEach(country => {

  country.addEventListener("click", function() {

    if (!answer) return;

    if (this.id === answer) {

      this.classList.add("correct");
      correct++;

      document.getElementById("result").textContent =
        "✅ Správně!";

    } else {

      this.classList.add("wrong");
      wrong++;

      document.getElementById("result").textContent =
        "❌ Špatně – správná země je " + countries[answer];
    }

    document.getElementById("score").textContent =
      "Správně: " + correct + " | Chybně: " + wrong;
  });

});

newQuestion();

</script>

</body>
</html>
